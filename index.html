<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden Flights - Global Booking Engine</title>
    <!-- typography: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0e0f1a;
            --bg-darker: #070714;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --text-white: #ffffff;
            --text-muted: #9ca3af;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --radius-big: 28px;
            --radius-med: 18px;
            --shadow-glow: 0 0 40px rgba(59,130,246,0.3);
            --hack-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-white);
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(circle at 10% 10%, #1a1b3a 0%, var(--bg-deep) 50%);
        }

        .app-shell {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4rem;
        }

        .logo {
            font-size: 1.25rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-transform: uppercase;
            font-weight: 800;
        }

        .logo-box {
            width: 32px;
            height: 32px;
            background: var(--accent-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 900;
        }

        /* Sections & Transitions */
        .view-section {
            display: none;
            opacity: 0;
            transform: scale(0.98);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .view-section.active {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            opacity: 1;
            transform: scale(1);
        }

        @media (max-width: 1024px) {
            .view-section.active {
                grid-template-columns: 1fr;
            }
        }

        /* 1. Home / Search View */
        .hero-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 5rem);
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: -3px;
            margin-bottom: 1.5rem;
        }

        .hero h1 span {
            color: var(--accent-primary);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.125rem;
            max-width: 400px;
            line-height: 1.6;
        }

        .search-container {
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            padding: 2.5rem;
            border-radius: var(--radius-big);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group label {
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 2px;
            color: #6b7280;
            margin-bottom: 0.5rem;
            display: block;
        }

        .input-wrapper input, .input-wrapper select {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.125rem;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.12);
        }

        .toggles {
            flex-direction: column;
            gap: 0.75rem;
            padding: 0.25rem;
        }

        .toggle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .toggle-item span {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .toggle-switch {
            width: 38px;
            height: 18px;
            background: #374151;
            border-radius: 20px;
            position: relative;
            transition: all 0.3s ease;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        input[type="checkbox"]:checked + .toggle-switch {
            background: var(--accent-primary);
        }

        input[type="checkbox"]:checked + .toggle-switch::after {
            left: 23px;
        }

        .btn-search {
            width: 100%;
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 1.25rem;
            border-radius: 18px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .btn-search:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        /* 2. Results View */
        #results-view.active {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
            align-items: start;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .results-title {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
        }

        .flight-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-big);
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .flight-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .flight-card.featured-hack {
            background: white;
            color: black;
            box-shadow: var(--shadow-glow);
            border: 4px solid rgba(59, 130, 246, 0.5);
            padding: 1.75rem;
            flex-direction: column;
            align-items: stretch;
            gap: 1.25rem;
        }

        .flight-card .badge {
            position: absolute;
            top: -12px;
            left: 20px;
            background: var(--accent-primary);
            color: white;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 0.6rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .flight-card.featured-hack .badge {
            animation: pulse-hack 2s infinite;
        }

        .airline-logo {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .flight-card.featured-hack .airline-logo { background: #f3f4f6; }

        .price {
            font-size: 1.25rem;
            font-weight: 900;
        }

        /* 3. Market Insights Column */
        .insights-col {
            position: sticky;
            top: 2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-big);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .insight-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.25rem;
            border-radius: 18px;
            border-left: 4px solid var(--accent-primary);
        }

        .insight-card h4 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .insight-card p {
            font-size: 0.9rem;
            font-weight: 600;
            color: white;
            line-height: 1.4;
        }

        .hack-tip {
            font-size: 0.8rem;
            color: #1e40af;
            background: #eff6ff;
            padding: 1rem;
            border-radius: 14px;
            border: 1px solid #bfdbfe;
        }

        .btn-live {
            background: #ffffff;
            color: #000;
            font-weight: 800;
            padding: 1.25rem;
            border-radius: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-live:hover {
            background: var(--accent-primary);
            color: white;
        }

        @keyframes pulse-hack {
            0% { transform: translateY(0); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: translateY(-2px); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { transform: translateY(0); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        @media (max-width: 1024px) {
            #results-view.active { grid-template-columns: 1fr; }
            .insights-col { display: none; }
        }

        /* Recent */
        .recent-searches {
            margin-top: 3rem;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header>
            <div class="logo">
                <div class="logo-box">HF</div>
                HIDDEN FLIGHTS
            </div>
            <div class="user-meta" style="display: flex; gap: 0.5rem;">
                <div style="width: 40px; height: 40px; border-radius: 99px; background: var(--glass); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem;">USD</div>
                <div style="width: 40px; height: 40px; border-radius: 99px; background: var(--glass); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; cursor: pointer;">⚙</div>
            </div>
        </header>

        <!-- View 1: Search -->
        <main id="search-view" class="view-section active">
            <div class="hero-col">
                <div class="hero">
                    <h1>Real-time<br/>Flight <span>Hacks</span></h1>
                    <p>Access data from every airport. We find the routes others miss by combining nearby hubs and car-accessible cities.</p>
                </div>
            </div>

            <div class="search-col">
                <div class="search-container">
                    <form id="main-search-form">
                        <div class="input-row">
                            <div class="form-group">
                                <label>From</label>
                                <div class="input-wrapper">
                                    <input type="text" id="from-input" placeholder="LHR" required value="London (LHR)">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>To</label>
                                <div class="input-wrapper">
                                    <input type="text" id="to-input" placeholder="JFK" required value="New York (JFK)">
                                </div>
                            </div>
                        </div>

                        <div class="input-row" style="margin-top: 0.5rem;">
                            <div class="form-group">
                                <label>Departure Date</label>
                                <div class="input-wrapper">
                                    <input type="date" id="date-input" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Passengers</label>
                                <div class="input-wrapper">
                                    <select id="passenger-input">
                                        <option value="1">1 Passenger</option>
                                        <option value="2">2 Passengers</option>
                                        <option value="3">3 Passengers</option>
                                        <option value="4">4 Passengers</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="toggles" style="margin-top: 1rem;">
                            <label class="toggle-item">
                                <span>Multi-Airline Hacks</span>
                                <input type="checkbox" id="hacks-toggle" hidden checked>
                                <div class="toggle-switch"></div>
                            </label>
                            <label class="toggle-item">
                                <span>Inter-Airport Car Routes</span>
                                <input type="checkbox" id="nearby-toggle" hidden checked>
                                <div class="toggle-switch"></div>
                            </label>
                        </div>

                        <button type="submit" class="btn-search" style="margin-top: 1.25rem;">Search Global Market</button>
                    </form>
                </div>
            </div>

            <div class="recent-searches">
                <h3 class="results-title">Recently Tracked Routes</h3>
                <div class="recent-grid" id="recent-list" style="display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem;">
                </div>
            </div>
        </main>

        <!-- View 2: Results -->
        <main id="results-view" class="view-section">
            <div class="results-col">
                <div class="results-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3 class="results-title" id="results-count">Results found: 0</h3>
                    <span style="font-size: 0.75rem; color: var(--accent-primary); font-weight: 700; cursor: pointer;">Sort By: Savings ↓</span>
                </div>
                
                <div class="results-list" id="results-container">
                    <!-- Dynamic Flight Cards -->
                </div>

                <div style="margin-top: 2rem;">
                    <button class="btn-search" style="background: var(--glass); border: 1px solid var(--glass-border); width: auto; padding: 0.75rem 2rem;" onclick="showView('search-view')">New Search</button>
                </div>
            </div>

            <div class="insights-col">
                <h3 class="results-title">Route Intelligence</h3>
                <div id="insight-content">
                    <!-- Dynamic Insight Panel -->
                </div>
                
                <div id="live-cta-container" style="margin-top: auto;">
                    <!--cta here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden Flights Engine -->
    <script>
        // State Management
        const state = {
            currentView: 'search-view',
            results: [],
            selectedFlight: null,
            recent: JSON.parse(localStorage.getItem('hidden_recent_v2') || '[]'),
            airportDB: [
                { name: 'London Heathrow', code: 'LHR', city: 'London' },
                { name: 'London Gatwick', code: 'LGW', city: 'London' },
                { name: 'John F. Kennedy', code: 'JFK', city: 'New York' },
                { name: 'Newark Liberty', code: 'EWR', city: 'New York' },
                { name: 'Philadelphia Intl', code: 'PHL', city: 'Philadelphia' },
                { name: 'Paris CDG', code: 'CDG', city: 'Paris' },
                { name: 'Brussels Intl', code: 'BRU', city: 'Brussels' },
                { name: 'Narita Tokyo', code: 'NRT', city: 'Tokyo' },
                { name: 'Osaka Itami', code: 'ITM', city: 'Osaka' }
            ]
        };

        const views = document.querySelectorAll('.view-section');
        const searchForm = document.getElementById('main-search-form');
        const resultsContainer = document.getElementById('results-container');
        const insightContent = document.getElementById('insight-content');
        const liveCtaContainer = document.getElementById('live-cta-container');
        const recentList = document.getElementById('recent-list');
        const resultsCountLabel = document.getElementById('results-count');

        const defaultDate = new Date();
        defaultDate.setDate(defaultDate.getDate() + 14);
        document.getElementById('date-input').value = defaultDate.toISOString().split('T')[0];

        renderRecent();

        function showView(viewId) {
            views.forEach(v => v.classList.remove('active'));
            setTimeout(() => {
                const activeView = document.getElementById(viewId);
                activeView.classList.add('active');
                state.currentView = viewId;
                window.scrollTo(0, 0);
            }, 100);
        }

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const from = document.getElementById('from-input').value;
            const to = document.getElementById('to-input').value;
            const passengers = document.getElementById('passenger-input').value;
            const date = document.getElementById('date-input').value;

            saveRecent({ from, to, date, passengers });
            
            document.getElementById('results-count').innerText = "Searching live flights...";
            resultsContainer.innerHTML = '<div style="padding: 2rem; text-align: center; color: var(--accent-primary);">Scanning airlines...</div>';
            showView('results-view');
            
            await generateFlights(from, to, passengers);
        });

        function saveRecent(query) {
            state.recent = [query, ...state.recent.filter(r => r.from !== query.from || r.to !== query.to)].slice(0, 5);
            localStorage.setItem('hidden_recent_v2', JSON.stringify(state.recent));
            renderRecent();
        }

        function renderRecent() {
            recentList.innerHTML = state.recent.length ? '' : '<p style="color: var(--text-muted); font-size: 0.8rem;">No recent routes tracked.</p>';
            state.recent.forEach(r => {
                const card = document.createElement('div');
                card.style.cssText = 'background: var(--glass); border: 1px solid var(--glass-border); padding: 1rem; border-radius: 16px; min-width: 170px; cursor: pointer; transition: all 0.3s ease;';
                card.innerHTML = `<p style="font-size: 0.85rem; font-weight: 800; margin-bottom: 2px;">${r.from} » ${r.to}</p><p style="font-size: 0.7rem; color: var(--text-muted); font-weight: 700;">${r.passengers} Pax • ${r.date}</p>`;
                card.onclick = () => {
                   document.getElementById('from-input').value = r.from;
                   document.getElementById('to-input').value = r.to;
                   document.getElementById('passenger-input').value = r.passengers;
                   searchForm.dispatchEvent(new Event('submit'));
                };
                recentList.appendChild(card);
            });
        }

        async function generateFlights(from, to, pax) {
            const airlines = [
                { name: 'SkyHigh', logo: '✈️' },
                { name: 'Horizon', logo: '🌅' },
                { name: 'Velocity', logo: '⚡' }
            ];

            const fromCode = (from.match(/\(([^)]+)\)/)?.[1] || from.substring(0, 3)).toUpperCase();
            const toCode = (to.match(/\(([^)]+)\)/)?.[1] || to.substring(0, 3)).toUpperCase();
            const date = document.getElementById('date-input').value;

            const hackPairs = {
                'NYC': ['PHL', 'EWR', 'BOS'],
                'JFK': ['EWR', 'PHL'],
                'LHR': ['LGW', 'STN', 'LTN'],
                'CDG': ['BRU', 'ORY'],
                'NRT': ['HND', 'ITM']
            };

            let results = [];
            const multiplier = parseInt(pax);
            let apiFailed = false;

            try {
                const response = await fetch(`/api/flights?departure_id=${fromCode}&arrival_id=${toCode}&outbound_date=${date}&adults=${pax}`);
                const data = await response.json();

                if (data.mockNeeded || data.error) {
                    apiFailed = true;
                    console.warn(data.error || "Failed to load real flights");
                    if (data.mockNeeded) {
                        const countEl = document.getElementById('results-count');
                        if(countEl) countEl.innerHTML += ' <span style="color:#f59e0b; font-size: 0.8rem; margin-left: 10px;">(API Key needed for live pricing, showing demo data)</span>';
                    }
                } else if (data.best_flights || data.other_flights) {
                    const allFlights = [...(data.best_flights || []), ...(data.other_flights || [])];
                    if (allFlights.length > 0) {
                        results = allFlights.slice(0, 4).map((f, i) => {
                            const mainLeg = f.flights[0];
                            const isHack = !!(hackPairs[toCode] && hackPairs[toCode].includes(mainLeg.arrival_airport.id));
                            return {
                                id: i + 1,
                                airline: { name: mainLeg.airline || airlines[i%airlines.length].name, logo: airlines[i%airlines.length].logo },
                                from,
                                fromCode: mainLeg.departure_airport.id || fromCode,
                                to: isHack ? (mainLeg.arrival_airport.name || toCode) : to,
                                toCode: mainLeg.arrival_airport.id || toCode,
                                depTime: mainLeg.departure_airport.time ? new Date(mainLeg.departure_airport.time).toLocaleTimeString([], {timeStyle: 'short'}) : 'Morning',
                                arrTime: mainLeg.arrival_airport.time ? new Date(mainLeg.arrival_airport.time).toLocaleTimeString([], {timeStyle: 'short'}) : 'Afternoon',
                                duration: `${Math.floor(mainLeg.duration/60)}h ${mainLeg.duration%60}m`,
                                price: f.price,
                                isHack,
                                originalPrice: f.price + 180,
                                targetCode: toCode,
                                badge: i === 0 ? 'Best Real Flight' : (isHack ? 'Hidden Hack' : '')
                            };
                        });
                    } else {
                        apiFailed = true;
                    }
                } else {
                    apiFailed = true;
                }
            } catch (e) {
                console.error(e);
                apiFailed = true;
            }

            if (apiFailed || results.length === 0) {
                // Fallback to mock data
                results = [];
                results.push({
                    id: 1, airline: airlines[0], from, fromCode, to, toCode,
                    depTime: '10:00 AM', arrTime: '02:00 PM',
                    duration: '6h 00m', price: 650 * multiplier, badge: 'Standard Market'
                });

                results.push({
                    id: 2, airline: airlines[1], from, fromCode, to, toCode,
                    depTime: '11:30 PM', arrTime: '08:15 AM',
                    duration: '6h 45m', price: 480 * multiplier, badge: 'Best Direct'
                });

                const destCities = hackPairs[toCode] || ['PHL'];
                const hackPort = state.airportDB.find(a => a.code === destCities[0]) || { name: 'Nearby Hub', code: destCities[0] };
                
                results.push({
                    id: 3, airline: airlines[2], from, fromCode, to: hackPort.name, toCode: hackPort.code,
                    depTime: '08:15 AM', arrTime: '11:45 AM', duration: '3h 30m', 
                    price: 210 * multiplier, isHack: true, targetCode: toCode, originalPrice: 480 * multiplier, badge: 'Hidden Hack'
                });
            }

            state.results = results;
            renderResults();
            selectFlight(results[results.length - 1]);
        }

        function renderResults() {
            resultsContainer.innerHTML = '';
            resultsCountLabel.innerText = `Results found: ${state.results.length}`;
            state.results.forEach(f => {
                const card = document.createElement('div');
                card.className = `flight-card ${f.isHack ? 'featured-hack' : ''}`;
                const badge = f.badge ? `<div class="badge">${f.badge}</div>` : '';
                
                card.innerHTML = `
                    ${badge}
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <div class="airline-logo">${f.airline.logo}</div>
                            <div>
                                <p style="font-size: 0.65rem; color: #6b7280; font-weight: 800; text-transform: uppercase;">${f.airline.name} • HF-${Math.floor(Math.random()*900)+100}</p>
                                <div class="price" style="${!f.isHack ? 'color:white;' : ''}">$${f.price}</div>
                            </div>
                        </div>
                        <div style="text-align: right;">
                             <div style="display: flex; gap: 1.5rem; align-items: center;">
                                <div style="text-align: center;">
                                    <p style="font-size: 1.1rem; font-weight: 900;">${f.fromCode}</p>
                                    <p style="font-size: 0.6rem; color: #9ca3af; text-transform: uppercase;">Dept</p>
                                </div>
                                <div style="width: 40px; height: 1px; background: #6b7280; opacity: 0.3;"></div>
                                <div style="text-align: center;">
                                    <p style="font-size: 1.1rem; font-weight: 900;">${f.toCode}</p>
                                    <p style="font-size: 0.6rem; color: #9ca3af; text-transform: uppercase;">Arrival</p>
                                </div>
                             </div>
                        </div>
                    </div>
                `;

                if (f.isHack) {
                    const hackHtml = `
                        <div class="hack-tip">
                            <strong>💡 Strategy:</strong> Booking to ${f.toCode} instead of ${f.targetCode} saves you <strong>$${f.originalPrice - f.price}</strong>. 
                            Airport is accessible via a 45-min car ride or shuttle to your final destination.
                        </div>
                    `;
                    card.insertAdjacentHTML('beforeend', hackHtml);
                }

                card.onclick = () => selectFlight(f);
                resultsContainer.appendChild(card);
            });
        }

        function selectFlight(f) {
            state.selectedFlight = f;
            
            document.querySelectorAll('.flight-card').forEach(c => c.style.borderColor = '');
            const activeCard = Array.from(document.querySelectorAll('.flight-card')).find(c => c.querySelector('.price').innerText.includes(f.price));
            if(activeCard) activeCard.style.borderColor = 'var(--accent-primary)';

            insightContent.innerHTML = `
                <div class="insight-card">
                    <h4>Route Efficiency</h4>
                    <p>${f.isHack ? 'Highly Optimized. Car-link required for final leg.' : 'Standard direct routing. No extra transit needed.'}</p>
                </div>
                <div class="insight-card" style="border-color: #10b981;">
                    <h4>Pricing Trend</h4>
                    <p>Current price is $${Math.floor(f.price * 0.9)} lower than last week's average for this date.</p>
                </div>
                <div class="insight-card" style="border-color: #f59e0b;">
                    <h4>Route Demand</h4>
                    <p>High demand detected. 128 other users tracked this route in the last 24h.</p>
                </div>
            `;

            const gFlightsUrl = `https://www.google.com/travel/flights?q=Flights%20from%20${f.fromCode}%20to%20${f.toCode}%20on%20${document.getElementById('date-input').value}`;

            liveCtaContainer.innerHTML = `
                <div onclick="window.open('${gFlightsUrl}', '_blank')" class="btn-live">
                    Verify on Google Flights
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                </div>
                <p style="font-size: 0.65rem; color: var(--text-muted); text-align: center; margin-top: 1rem; font-weight: 600;">Secure your rate via our live partners.</p>
            `;
        }
    </script>
</body>
</html>
